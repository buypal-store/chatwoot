name: Build Custom Chatwoot Image

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:update-4.17.1-v1
          build-args: |
            VITE_INFORME_ASESORES_URL=${{ vars.VITE_INFORME_ASESORES_URL }}
            VITE_INFORME_ASESORES_TOKEN=${{ secrets.VITE_INFORME_ASESORES_TOKEN }}
            VITE_ALERTAS_URL=${{ vars.VITE_ALERTAS_URL }}
            VITE_ALERTAS_TOKEN=${{ secrets.VITE_ALERTAS_TOKEN }}
